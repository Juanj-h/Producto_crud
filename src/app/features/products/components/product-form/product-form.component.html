<div class="form-container">

  <h2>Crear Producto</h2>

  <input
    type="text"
    placeholder="Nombre"
    [(ngModel)]="nombre"
  >

  <input
    type="number"
    placeholder="Precio"
    [(ngModel)]="precio"
  >

  <button (click)="crearProducto()">
    Agregar
  </button>

</div>
